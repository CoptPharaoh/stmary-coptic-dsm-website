<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Current parish announcements from St. Mary Coptic Orthodox Church in Des Moines, Iowa.">
  <title>Parish Announcements | St. Mary</title>
  <link rel="stylesheet" href="css/style.css?v=76264de5f37d">
</head>
<body>
  <div data-site-header></div>
  <main class="page-main announcements-page">
    <section class="page-hero">
      <div class="page-hero-inner"><div>
        <p class="eyebrow">Parish Life</p>
        <h1>Parish Announcements</h1>
        <p>News and updates from our church community.</p>
      </div></div>
    </section>
    <div class="page-shell content-page announcements-content">
      <section class="parish-announcements announcement-feed" data-announcements="full" aria-labelledby="latest-announcements-title">
        <h2 id="latest-announcements-title">Latest Announcements</h2>
        <p id="announcement-status" role="status">Loading announcements...</p>
        <button id="announcement-retry" class="btn btn-primary" type="button" hidden>Try again</button>
        <div id="announcement-list"></div>
        <noscript>Enable JavaScript to retrieve current announcements.</noscript>
      </section>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="js/main.js?v=e59ba7094026"></script>
  <script type="module" src="js/public-content.js?v=f954190b6f12"></script>
</body>
</html>
